version: '3.8'

services:
  personal-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naveen-personal-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_NAME=Naveen Kumar Personal API
      - CORS_ORIGIN=*
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX=150
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
